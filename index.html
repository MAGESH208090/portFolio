<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magesh Kumar | Portfolio</title>
    <meta name="description" content="Portfolio of Magesh Kumar - A Full Stack Developer">
    <meta name="keywords" content="Magesh Kumar, Portfolio, Full Stack Developer, Java, Spring Boot, Web Development">
    <meta name="author" content="Magesh Kumar">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            color: #333;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 15px 0;
        }
        nav ul {
            list-style: none;
            padding: 0;
            display: flex;
            justify-content: center;
            gap: 20px;
        }
        nav ul li {
            display: inline;
        }
        nav ul li a {
            text-decoration: none;
            color: white;
            font-weight: bold;
        }
        .container {
            width: 80%;
            margin: auto;
            text-align: center;
        }
        section {
            padding: 50px 0;
        }
        .dark-mode {
            background-color: #222;
            color: #f4f4f4;
        }
        .contact-form input, .contact-form textarea {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <header>
        <h1>Magesh Kumar</h1>
        <nav>
            <ul>
                <li><a href="#about">About</a></li>
                <li><a href="#projects">Projects</a></li>
                <li><a href="#contact">Contact</a></li>
                <li><button onclick="toggleDarkMode()">Dark Mode</button></li>
            </ul>
        </nav>
    </header>
    <section id="about" class="container">
        <h2>About Me</h2>
        <p>I'm a passionate Full Stack Developer skilled in Java, Spring Boot, and web development.</p>
    </section>
    <section id="projects" class="container">
        <h2>Projects</h2>
        <div id="project-list">Loading projects...</div>
    </section>
    <section id="contact" class="container">
        <h2>Contact Me</h2>
        <form id="contact-form" class="contact-form">
            <input type="text" name="name" placeholder="Your Name" required>
            <input type="email" name="email" placeholder="Your Email" required>
            <textarea name="message" placeholder="Your Message" required></textarea>
            <button type="submit">Send Message</button>
        </form>
    </section>
    <footer>
        <p>&copy; 2024 Magesh Kumar</p>
    </footer>
    <script>
        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
        }
        document.getElementById('contact-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            let formData = new FormData(e.target);
            let response = await fetch('https://your-api-endpoint/contact', {
                method: 'POST',
                body: JSON.stringify(Object.fromEntries(formData)),
                headers: { 'Content-Type': 'application/json' }
            });
            alert(await response.text());
        });
        async function loadProjects() {
            let response = await fetch('https://your-api-endpoint/projects');
            let projects = await response.json();
            document.getElementById('project-list').innerHTML = projects.map(proj => `<div><h3>${proj.name}</h3><p>${proj.description}</p></div>`).join('');
        }
        loadProjects();
    </script>
</body>
</html>
